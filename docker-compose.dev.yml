version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nest-yunpan-mysql-dev
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: nest_yunpan_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - app-network-dev

  redis:
    image: redis:7.0
    container_name: nest-yunpan-redis-dev
    command: redis-server --appendonly yes
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - app-network-dev

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nest-yunpan-app-dev
    restart: always
    ports:
      - "3000:3000"
      - "9229:9229"  # 用于调试
    volumes:
      - .:/app  # 源代码映射
      - /app/node_modules  # 排除 node_modules 映射
    environment:
      - NODE_ENV=development
    depends_on:
      - mysql
      - redis
    networks:
      - app-network-dev

networks:
  app-network-dev:
    driver: bridge

volumes:
  mysql_data_dev:
  redis_data_dev: